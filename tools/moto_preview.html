<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>moto preview</title>
  <style>
    html, body { margin: 0; background: #8d98a3; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "/addons/node_modules/three/build/three.module.js",
    "three/addons/": "/addons/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const params = new URLSearchParams(location.search);
const view = params.get("view") || "sheet";
const lean = Number(params.get("lean") || 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9aa6b2);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff4e8, 2.2);
key.position.set(3, 5, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd5e4ff, 0.8);
fill.position.set(-4, 2, -3);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(0, 2, -4);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4, 40),
  new THREE.MeshStandardMaterial({ color: 0x6e787f, roughness: 0.9 }),
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
scene.add(ground);

const gltf = await new GLTFLoader().loadAsync("/game/models/moto.glb");
const model = gltf.scene;
model.rotation.z = lean;
scene.add(model);
model.traverse((o) => {
  if (o.name && o.name.endsWith("_far")) o.visible = params.get("lod") === "far" ? true : false;
  if (o.name && (o.name === "sport_bike" || o.name === "sport_rider")) o.visible = params.get("lod") !== "far";
});

const views = {
  front: { pos: [-1.55, 0.85, -2.15], look: [0, 0.72, -0.15], fov: 32 },
  side: { pos: [2.7, 0.85, 0.05], look: [0, 0.68, -0.05], fov: 30 },
  ride: { pos: [0.85, 1.15, 2.15], look: [0, 0.85, 0.1], fov: 34 },
  rear: { pos: [0.7, 1.05, 2.4], look: [0, 0.8, 0.15], fov: 32 },
};

function frame(name, x, y, w, h) {
  const cam = new THREE.PerspectiveCamera(views[name].fov, w / h, 0.05, 50);
  const p = views[name];
  cam.position.set(p.pos[0], p.pos[1], p.pos[2]);
  cam.lookAt(p.look[0], p.look[1], p.look[2]);
  renderer.setViewport(x, y, w, h);
  renderer.setScissor(x, y, w, h);
  renderer.setScissorTest(true);
  renderer.render(scene, cam);
}

const W = window.innerWidth, H = window.innerHeight;
if (view === "sheet") {
  frame("front", 0, 0, W / 3, H);
  frame("side", W / 3, 0, W / 3, H);
  frame("ride", (W / 3) * 2, 0, W / 3, H);
} else {
  frame(view, 0, 0, W, H);
}
window.__ready = true;
</script>
</body>
</html>
