<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#8e99a4;overflow:hidden}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/addons/node_modules/three/build/three.module.js","three/addons/":"/addons/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const params = new URLSearchParams(location.search);
const file = params.get("file") || "/.tmp/sport.glb";
const view = params.get("view") || "side";
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8e99a4);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(4, 6, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0xc5d6ea, 0.85);
fill.position.set(-3, 2, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(0, 3, -5);
scene.add(rim);
const gltf = await new GLTFLoader().loadAsync(file);
const model = gltf.scene;
model.traverse((o) => {
  if (o.name === "sport_bike_far" || /_far$/.test(o.name)) o.visible = false;
});
scene.add(model);
const lean = Number(params.get("lean") || 0);
if (lean) model.rotation.z = lean;
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(Math.max(size.x, size.z) * 1.4, 48),
  new THREE.MeshStandardMaterial({ color: 0x6a7278, roughness: 0.92 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = box.min.y - 0.001;
scene.add(ground);
const look = center.clone();
look.y = box.min.y + size.y * 0.42;
const dist = Math.max(size.x, size.y, size.z);
const views = {
  side: new THREE.Vector3(center.x + dist * 1.35, look.y + dist * 0.12, center.z),
  front: new THREE.Vector3(center.x, look.y + dist * 0.08, box.min.z - dist * 0.85),
  rear: new THREE.Vector3(center.x + dist * 0.15, look.y + dist * 0.18, box.max.z + dist * 0.95),
  three: new THREE.Vector3(center.x + dist * 0.72, look.y + dist * 0.28, box.min.z - dist * 0.85),
  rear3: new THREE.Vector3(center.x - dist * 0.7, look.y + dist * 0.32, box.max.z + dist * 0.7),
  tail: new THREE.Vector3(center.x + 0.7, 0.95, box.max.z + 0.15),
  ride: new THREE.Vector3(0.85, 1.2, box.max.z + dist * 0.55),
  // Game chase cam, in this preview's space (nose is -Z, tail is +Z).
  chase: new THREE.Vector3(0, 1.84, 4.16),
};
const cam = new THREE.PerspectiveCamera(view === "tail" ? 22 : 30, window.innerWidth / window.innerHeight, 0.02, 80);
cam.position.copy(views[view] || views.side);
if (view === "tail") look.set(center.x, 0.78, box.max.z - 0.22);
if (view === "ride") look.set(0, 0.78, 0.05);
if (view === "chase") look.set(0, 1.5, 0);
cam.lookAt(look);
if (params.get("colorize")) {
  const palette = [0xe6194b,0x3cb44b,0xffe119,0x4363d8,0xf58231,0x911eb4,0x42d4f4,0xf032e6,0xbfef45,0xfabed4,0x469990,0xdcbeff,0x9a6324,0x800000,0xaaffc3,0x808000,0x000075,0xa9a9a9];
  let i = 0;
  model.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    o.material = new THREE.MeshStandardMaterial({ color: palette[i % palette.length], roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide });
    i++;
  });
}
let tris = 0;
model.traverse((o) => {
  if (o.isMesh) {
    const g = o.geometry;
    tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  }
});
renderer.render(scene, cam);
window.__ready = true;
window.__info = { size: size.toArray(), center: center.toArray(), min: box.min.toArray(), tris };
</script></body></html>
