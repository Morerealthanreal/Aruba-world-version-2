name: Browser tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  aruba-world:
    name: Aruba World (${{ matrix.quality }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        quality: [low, high]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            addons/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix addons

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and test ${{ matrix.quality }}
        run: npm run test:e2e -- --project=${{ matrix.quality }}

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aruba-world-${{ matrix.quality }}-browser-artifacts
          path: tests/artifacts/
          if-no-files-found: warn
          retention-days: 14
