name: Browser tests

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the older run, so stale runs stop
# holding runners while many PRs are open at once.
concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each quality is split into Playwright shards that run in parallel. Playwright
# shards the spec list in file order, so a new spec lands in a shard on its own
# and nothing drops out of coverage.
#   LOW  3 shards: [travel modes, audio] [fan corner, HUD] [phone soak]
#   HIGH 2 shards: [travel modes, audio, fan corner*] [HUD, phone soak*]
#   (* skipped on HIGH by the spec itself)
# The final "Aruba World (low)" / "Aruba World (high)" jobs keep the check
# names other agents already watch and pass only when every shard passed.

jobs:
  low-shards:
    name: Aruba World low shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # The phone soak shard is the longest (~8 min, ~16 with its CI retry).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            addons/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix addons

      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install headless Chromium
        # Skips the download when the cache holds this version; system
        # libraries still come from apt.
        run: npx playwright install --with-deps chromium

      - name: Build and test low shard ${{ matrix.shard }}/3
        run: npm run test:e2e -- --project=low --shard=${{ matrix.shard }}/3

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aruba-world-low-shard${{ matrix.shard }}of3-browser-artifacts
          path: tests/artifacts/
          if-no-files-found: warn
          retention-days: 14

  high-shards:
    name: Aruba World high shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # The travel-mode run is the longest HIGH test (~8 min).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            addons/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix addons

      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install headless Chromium
        # Skips the download when the cache holds this version; system
        # libraries still come from apt.
        run: npx playwright install --with-deps chromium

      - name: Build and test high shard ${{ matrix.shard }}/2
        run: npm run test:e2e -- --project=high --shard=${{ matrix.shard }}/2

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aruba-world-high-shard${{ matrix.shard }}of2-browser-artifacts
          path: tests/artifacts/
          if-no-files-found: warn
          retention-days: 14

  low:
    name: Aruba World (low)
    needs: low-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All low shards passed
        env:
          SHARDS: ${{ needs.low-shards.result }}
        run: |
          echo "low shards: $SHARDS"
          test "$SHARDS" = "success"

  high:
    name: Aruba World (high)
    needs: high-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All high shards passed
        env:
          SHARDS: ${{ needs.high-shards.result }}
        run: |
          echo "high shards: $SHARDS"
          test "$SHARDS" = "success"
